apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopstask-flask
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devopstask-flask
  template:
    metadata:
      labels:
        app: devopstask-flask
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: devopstask-flask
          image: devopstaskacr001.azurecr.io/devopstask-flask:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5002