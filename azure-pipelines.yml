trigger:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  imageName: 'devopstask-flask'
  imageTag: '$(Build.BuildId)'
  acrLoginServer: 'devopstaskacr001.azurecr.io'

steps:
  - checkout: self

  - script: |
      echo "Checking Python version..."
      python3 --version
    displayName: "Check Python version"

  - script: |
      echo "Installing dependencies..."
      python3 -m pip install --upgrade pip
      python3 -m pip install -r requirements.txt
    displayName: "Install Python dependencies"

  - script: |
      echo "Running Python syntax check..."
      python3 -m py_compile app.py
    displayName: "Run Python syntax check"

  - script: |
      echo "Building Docker image..."
      docker build -t $(imageName):$(imageTag) .
      docker tag $(imageName):$(imageTag) $(acrLoginServer)/$(imageName):$(imageTag)
      docker images | grep $(imageName)
    displayName: "Build and tag Docker image"

  - script: |
      echo "Logging in to Azure Container Registry..."
      echo "$(ACR_PASSWORD)" | docker login $(acrLoginServer) -u "$(ACR_USERNAME)" --password-stdin
    displayName: "Login to ACR"

  - script: |
      echo "Pushing Docker image to ACR..."
      docker push $(acrLoginServer)/$(imageName):$(imageTag)
    displayName: "Push Docker image to ACR"